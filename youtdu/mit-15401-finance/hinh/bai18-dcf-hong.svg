<text x="20.0" y="442.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">12/28 doanh nghiệp có dòng tiền tự do bình quân 5 năm ÂM, nên công thức Gordon không dùng được. Không phải vì họ làm ăn kém</text>
<text x="20.0" y="458.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">— mà vì họ đang đầu tư mạnh hơn số tiền làm ra. Đó là giới hạn thật của DCF sách giáo khoa.</text>
