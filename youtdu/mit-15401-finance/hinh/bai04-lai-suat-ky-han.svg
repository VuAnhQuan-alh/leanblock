<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img">
<rect width="760" height="400" fill="#fdfdfb"/>
<text x="380.0" y="26.0" font-size="16" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Lãi suất kỳ hạn: dự báo đã nằm sẵn trong hai mức giá</text>
<line x1="90" y1="200" x2="670" y2="200" stroke="#444" stroke-width="2"/>
<line x1="90" y1="192" x2="90" y2="208" stroke="#444" stroke-width="2"/>
<text x="90.0" y="228.0" font-size="12" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">năm 0</text>
<line x1="380" y1="192" x2="380" y2="208" stroke="#444" stroke-width="2"/>
<text x="380.0" y="228.0" font-size="12" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">năm 1</text>
<line x1="670" y1="192" x2="670" y2="208" stroke="#444" stroke-width="2"/>
<text x="670.0" y="228.0" font-size="12" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">năm 2</text>
<path d="M90,190 Q235.0,110 380,190" fill="none" stroke="#1a6fb5" stroke-width="2.4"/>
<text x="235.0" y="140.6" font-size="13" fill="#1a6fb5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">r₁ = 3,41%</text>
<path d="M90,190 Q380.0,50 670,190" fill="none" stroke="#1f8a4c" stroke-width="2.4"/>
<text x="380.0" y="101.0" font-size="13" fill="#1f8a4c" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">r₂ = 3,86%  (hai năm)</text>
<path d="M380,210 Q525.0,290 670,210" fill="none" stroke="#c0392b" stroke-width="2.4"/>
<text x="525.0" y="273.4" font-size="13" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">f₁,₂ = ?</text>
<text x="380.0" y="318.0" font-size="15" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">(1 + r₂)²  =  (1 + r₁) × (1 + f₁,₂)</text>
<text x="380.0" y="344.0" font-size="14" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">(1,0386)²  =  (1,0341) × (1 + f)   →   f₁,₂ = 4.31%</text>
<text x="380.0" y="62.0" font-size="13" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Không ai công bố lãi suất một năm BẮT ĐẦU TỪ NĂM SAU.</text>
<text x="380.0" y="84.0" font-size="12" fill="#444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Nhưng nó đã bị khoá chặt bởi hai mức giá đang niêm yết — chỉ cần chia là ra.</text>
<text x="380.0" y="380.0" font-size="11" fill="#888" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Đây là toàn bộ ý tưởng của bài 4: một bảng giá tĩnh chứa sẵn dự báo của thị trường về tương lai.</text>
</svg>
