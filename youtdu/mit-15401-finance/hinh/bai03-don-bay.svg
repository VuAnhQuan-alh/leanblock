<text x="20.0" y="442.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Đòn bẩy 1:1 mất 10%. Đòn bẩy 20:1 mất TOÀN BỘ vốn và còn âm. Bảng cân đối không hét lên con số này — bạn phải tự chia.</text>
