<text x="278.2" y="252.8" font-size="10" fill="#888" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">cổ phiếu riêng lẻ nằm DƯỚI</text>
<text x="200.0" y="342.0" font-size="12" fill="#444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">σ — độ lệch chuẩn</text>
<text x="200.0" y="366.0" font-size="11" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Chỉ đúng cho danh mục HIỆU QUẢ.</text>
<text x="200.0" y="383.0" font-size="11" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Mọi thứ khác nằm DƯỚI đường.</text>
<rect x="410.0" y="70" width="340.0" height="250" fill="#fff" stroke="#e4e4e0"/>
<text x="580.0" y="56.0" font-size="13" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">ĐƯỜNG THỊ TRƯỜNG CHỨNG KHOÁN  (SML)</text>
<line x1="456.0" y1="320.0" x2="736.0" y2="320.0" stroke="#aaa"/>
<line x1="456.0" y1="320.0" x2="456.0" y2="112.22222222222223" stroke="#aaa"/>
