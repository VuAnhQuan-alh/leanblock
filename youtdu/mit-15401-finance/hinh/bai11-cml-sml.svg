<text x="448.0" y="275.1" font-size="11" fill="#666" text-anchor="end" font-family="Helvetica,Arial,sans-serif">rf</text>
<circle cx="512.0" cy="241.77777777777777" r="3.6" fill="#c0392b" opacity="0.55"/>
<circle cx="561.0" cy="216.11111111111111" r="3.6" fill="#c0392b" opacity="0.55"/>
<circle cx="645.0" cy="172.11111111111111" r="3.6" fill="#c0392b" opacity="0.55"/>
<circle cx="701.0" cy="142.77777777777777" r="3.6" fill="#c0392b" opacity="0.55"/>
<text x="652.0" y="268.7" font-size="10" fill="#888" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">mọi chứng khoán nằm TRÊN đường</text>
<text x="580.0" y="342.0" font-size="12" fill="#444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">β — beta</text>
<text x="580.0" y="366.0" font-size="11" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Đúng cho MỌI chứng khoán và mọi danh mục,</text>
<text x="580.0" y="383.0" font-size="11" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">hiệu quả hay không.</text>
<text x="390.0" y="418.0" font-size="11" fill="#888" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Cùng một điểm “danh mục thị trường” nằm trên cả hai — nhưng TRỤC NGANG khác nhau. Đó là toàn bộ chỗ dễ nhầm.</text>
