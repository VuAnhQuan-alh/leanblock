<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img">
<rect width="760" height="440" fill="#fdfdfb"/>
<text x="380.0" y="26.0" font-size="16" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Cỗ máy biến hai trái phiếu rác thành một AAA — và chỗ nó gãy</text>
<rect x="50" y="90" width="150" height="60" rx="5" fill="#fdeeec" stroke="#c0392b" stroke-width="2"/>
<text x="125.0" y="116.5" font-size="12" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Trái phiếu 1</text>
<text x="125.0" y="131.5" font-size="12" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">xác suất vỡ 10%</text>
<rect x="50" y="190" width="150" height="60" rx="5" fill="#fdeeec" stroke="#c0392b" stroke-width="2"/>
<text x="125.0" y="216.5" font-size="12" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Trái phiếu 2</text>
<text x="125.0" y="231.5" font-size="12" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">xác suất vỡ 10%</text>
<rect x="300" y="130" width="150" height="80" rx="5" fill="#f4f4f0" stroke="#111" stroke-width="2"/>
<text x="375.0" y="166.5" font-size="12" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">GỘP LẠI</text>
<text x="375.0" y="181.5" font-size="12" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">rồi cắt lớp</text>
<rect x="560" y="90" width="150" height="60" rx="5" fill="#eef7f1" stroke="#1f8a4c" stroke-width="2"/>
<text x="635.0" y="116.5" font-size="12" fill="#1f8a4c" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Lớp ƯU TIÊN</text>
<text x="635.0" y="131.5" font-size="12" fill="#1f8a4c" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">chỉ vỡ khi CẢ HAI vỡ</text>
<rect x="560" y="190" width="150" height="60" rx="5" fill="#fdf5e6" stroke="#d98c00" stroke-width="2"/>
<text x="635.0" y="216.5" font-size="12" fill="#d98c00" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Lớp THỨ CẤP</text>
<text x="635.0" y="231.5" font-size="12" fill="#d98c00" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">vỡ khi MỘT trong hai vỡ</text>
<line x1="200" y1="120" x2="298" y2="155" stroke="#777" stroke-width="2"/>
<line x1="200" y1="220" x2="298" y2="185" stroke="#777" stroke-width="2"/>
<line x1="450" y1="160" x2="558" y2="120" stroke="#777" stroke-width="2"/>
<line x1="450" y1="185" x2="558" y2="220" stroke="#777" stroke-width="2"/>
<text x="380.0" y="300.0" font-size="13" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Khi hai trái phiếu ĐỘC LẬP:</text>
<text x="380.0" y="322.0" font-size="12" fill="#1f8a4c" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">P(cả hai cùng vỡ) = 0,10 × 0,10 = 1%   →  lớp ưu tiên được xếp hạng AAA</text>
<text x="380.0" y="356.0" font-size="13" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">⚠️  Khi hai trái phiếu TƯƠNG QUAN HOÀN TOÀN:</text>
<text x="380.0" y="378.0" font-size="12" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">P(cả hai cùng vỡ) = 10%   →  lớp ưu tiên rác đúng bằng đầu vào</text>
<text x="380.0" y="414.0" font-size="12" fill="#888" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Quả bom không nằm trong công thức. Nó nằm ở chữ “không tương quan”.</text>
</svg>
