<text x="390.0" y="404.0" font-size="12" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Khung trái: một nghiệm, quy tắc IRR chạy đúng.  Khung phải: BA nghiệm — 0%, 100%, 200%.</text>
<text x="390.0" y="426.0" font-size="11" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Hỏi “IRR của dự án này là bao nhiêu?” đã sai từ câu hỏi. NPV thì luôn có đúng một giá trị.</text>
<text x="390.0" y="450.0" font-size="11" fill="#999" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Số lần đổi dấu của dòng tiền chặn trên số nghiệm dương — quy tắc dấu Descartes, không phải giả thuyết Riemann.</text>
