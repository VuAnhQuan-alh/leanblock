<text x="20.0" y="442.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Mục 10 nói convexity LUÔN dương nên biến động làm trái phiếu ĐÁNG GIÁ HƠN. Món vay mua nhà thì ngược: ở lãi suất 2%, trái</text>
<text x="20.0" y="458.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">phiếu thường đáng 203 còn món vay chỉ 100 — người vay trả trước đúng ở dư nợ. Đó là lý do chứng khoán thế chấp khó hơn trái</text>
<text x="20.0" y="474.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">phiếu.</text>
