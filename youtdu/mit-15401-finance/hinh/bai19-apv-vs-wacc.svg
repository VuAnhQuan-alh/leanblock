<text x="20.0" y="442.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Công thức WACC cần MỘT tỷ trọng nợ không đổi. Thương vụ này không có cái đó — nợ đi từ 68% xuống 0 trong 7 năm. Ba cách</text>
<text x="20.0" y="458.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">chọn cho ba kết quả khác nhau và không cách nào đúng. APV không cần biết tỷ trọng: nó chỉ cần dư nợ từng năm, thứ nằm ngay</text>
<text x="20.0" y="474.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">trong hợp đồng.</text>
