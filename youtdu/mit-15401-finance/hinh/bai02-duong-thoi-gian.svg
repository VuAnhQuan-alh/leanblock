<text x="380.0" y="328.0" font-size="12" fill="#444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">cộng lại được, vì giờ tất cả đã cùng một loại tiền</text>
<text x="380.0" y="414.0" font-size="11" fill="#888" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Tỷ giá ở đây là r = 10%/năm. $500 danh nghĩa → $379.08 hôm nay; chênh $120.92 là giá của thời gian.</text>
