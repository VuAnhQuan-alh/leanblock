<text x="380.0" y="26.0" font-size="16" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Đường thời gian: chiết khấu là ĐỔI TIỀN giữa hai thời điểm</text>
<text x="380.0" y="56.0" font-size="13" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Năm tờ 100 đô la ở năm thời điểm khác nhau là NĂM LOẠI TIỀN TỆ khác nhau.</text>
<text x="380.0" y="78.0" font-size="12" fill="#444" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Muốn cộng chúng lại, phải đổi hết về cùng một loại — đó là chiết khấu.</text>
