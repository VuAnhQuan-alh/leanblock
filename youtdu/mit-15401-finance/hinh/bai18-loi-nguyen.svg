<text x="20.0" y="442.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">Mỗi bên mua ước lượng KHÔNG thiên vị, sai số đều trong ±30%. Nhưng người thắng là người ước lượng cao nhất, nên kỳ vọng của</text>
<text x="20.0" y="458.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">ước lượng thắng cuộc luôn nằm trên giá trị thật — và chênh lệch tăng theo số đối thủ. Công thức: a×(N−1)/(N+1), không cần</text>
<text x="20.0" y="474.0" font-size="11" fill="#888" text-anchor="start" font-family="Helvetica,Arial,sans-serif">mô phỏng.</text>
