<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img">
<rect width="760" height="430" fill="#fdfdfb"/>
<text x="380.0" y="26.0" font-size="16" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Cây nhị thức: dựng một danh mục trả đúng như quyền chọn</text>
<rect x="88" y="183" width="124" height="64" rx="5" fill="#fff" stroke="#1a6fb5" stroke-width="2"/>
<text x="150.0" y="211.0" font-size="13" fill="#1a6fb5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">S₀ = 100</text>
<text x="150.0" y="227.0" font-size="13" fill="#1a6fb5" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">C₀ = ?</text>
<rect x="408" y="88" width="124" height="64" rx="5" fill="#fff" stroke="#1f8a4c" stroke-width="2"/>
<text x="470.0" y="116.0" font-size="13" fill="#1f8a4c" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">S↑ = 125</text>
<text x="470.0" y="132.0" font-size="13" fill="#1f8a4c" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">C↑ = 25</text>
<rect x="408" y="278" width="124" height="64" rx="5" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="470.0" y="306.0" font-size="13" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">S↓ = 80</text>
<text x="470.0" y="322.0" font-size="13" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">C↓ = 0</text>
<line x1="212" y1="203" x2="408" y2="120" stroke="#777" stroke-width="2"/>
<line x1="212" y1="227" x2="408" y2="310" stroke="#777" stroke-width="2"/>
<text x="320.0" y="150.0" font-size="12" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">u = 1.25</text>
<text x="320.0" y="292.0" font-size="12" fill="#666" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">d = 0.8</text>
<text x="380.0" y="372.0" font-size="13" fill="#111" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">Δ = (C↑ − C↓) / (S↑ − S↓) = 0.5556 cổ phiếu, vay B = -42.33</text>
<text x="380.0" y="396.0" font-size="13" fill="#c0392b" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="600">C₀ = Δ·S₀ + B = 13.23   —   và xác suất THẬT của u, d không xuất hiện ở đâu cả.</text>
<text x="380.0" y="420.0" font-size="11" fill="#888" text-anchor="middle" font-family="Helvetica,Arial,sans-serif">Xác suất trung hoà rủi ro q = (1+r−d)/(u−d) = 0.556 → C₀ = [q·C↑ + (1−q)·C↓]/(1+r) = 13.23</text>
</svg>
